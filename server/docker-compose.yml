version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codearena-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/codearena
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - JUDGE0_URL=http://judge0:2358
      - JUDGE0_API_KEY=${JUDGE0_API_KEY}
      - JUDGE0_POLL_INTERVAL=1000
      - JUDGE0_MAX_POLL_ATTEMPTS=15
      - CORS_ORIGIN=*
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6.0-jammy
    container_name: codearena-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
