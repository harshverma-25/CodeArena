<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Quizzy">
  <title>Quizzy</title>
  <!-- offset shadow -->
  <rect x="8" y="8" width="54" height="54" rx="13" fill="#111"/>
  <!-- badge -->
  <rect x="2" y="2" width="54" height="54" rx="13" fill="#FFD60A" stroke="#111" stroke-width="4"/>
  <!-- Q: black outline layer -->
  <g fill="none" stroke="#111" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="26" r="13"/>
    <line x1="30" y1="29" x2="44" y2="43"/>
  </g>
  <!-- Q: white fill layer -->
  <g fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="26" r="13"/>
    <line x1="30" y1="29" x2="44" y2="43"/>
  </g>
</svg>
